<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="items">
    <div class="item item1" draggable="true">01</div>
    <div class="item item2" draggable="true">02</div>
    <div class="item item3" draggable="true">03</div>
    <div class="item item4" draggable="true">04</div>
    <div class="item item5" draggable="true">05</div>
    <div class="item item6" draggable="true">06</div>
    <div class="item item7" draggable="true">07</div>
    <div class="item item8" draggable="true">08</div>
    <div class="item item9" draggable="true">09</div>
    <div class="item item10" draggable="true">10</div>
    <div class="item item11" draggable="true">11</div>
    <div class="item item12" draggable="true">12</div>
    <div class="item item13" draggable="true">13</div>
    <div class="item item14" draggable="true">14</div>
    <div class="item item15" draggable="true">15</div>
    <div class="item item16" draggable="true">16</div>
    <div class="item item17" draggable="true">17</div>
    <div class="item item18" draggable="true">18</div>
    <div class="item item19" draggable="true">19</div>
    <div class="item item20" draggable="true">20</div>
    <div class="item item21" draggable="true">21</div>
    <div class="item item22" draggable="true">22</div>
    <div class="item item23" draggable="true">23</div>
    <div class="item item24" draggable="true">24</div>
    <div class="item item25" draggable="true">25</div>
  </div>

<script>

const container = document.querySelector('.items');
let draggedItem = null;

container.addEventListener('dragstart', function(e) {
  if (!e.target.classList.contains('item')) return;

  draggedItem = e.target;
  e.target.classList.add('dragging');
});

container.addEventListener('dragend', function(e) {
  if (!e.target.classList.contains('item')) return;

  e.target.classList.remove('dragging');
  draggedItem = null;
});

container.addEventListener('dragover', function(e) {
  e.preventDefault();

  const afterElement = getDragAfterElement(container, e.clientX);
  const dragging = document.querySelector('.dragging');

  if (!dragging) return;

  if (afterElement == null) {
    container.appendChild(dragging);
  } else {
    container.insertBefore(dragging, afterElement);
  }
});

function getDragAfterElement(container, x) {
  const elements = [...container.querySelectorAll('.item:not(.dragging)')];

  let closest = null;
  let closestOffset = Number.NEGATIVE_INFINITY;

  elements.forEach(function(child) {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;

    if (offset < 0 && offset > closestOffset) {
      closestOffset = offset;
      closest = child;
    }
  });

  return closest;
}


</script>

	
  </body>
</html>
